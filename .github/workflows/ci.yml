name: CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning, everywhere, rather than letting them accumulate.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  # Every backend can be compiled out for a slim, single-backend binary. Each of those
  # configurations has to keep building, which the all-features jobs above don't prove.
  slim-builds:
    name: nexq-server (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [memory, postgres, sqlite, opensearch, elasticsearch]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: |
          if [ "${{ matrix.features }}" = "memory" ]; then
            # memory lives in nexq-core, so it needs no feature — this is the floor:
            # the server with every optional backend compiled out.
            cargo check -p nexq-server --no-default-features --locked
          else
            cargo check -p nexq-server --no-default-features \
              --features ${{ matrix.features }} --locked
          fi
