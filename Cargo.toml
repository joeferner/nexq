[workspace]
resolver = "3"
members = [
    "crates/nexq-core",
    "crates/nexq-store-memory",
    "crates/nexq-store-sql",
    "crates/nexq-store-search",
    "crates/nexq-store-conformance",
    "crates/nexq-api-rest",
    "crates/nexq-api-aws",
    "crates/nexq-metrics",
    "crates/nexq-keda",
    "crates/nexq-client",
    "crates/nexq-cli",
    "crates/nexq-server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Joe Ferner"]

# Internal crates. Dependencies point one way only:
#   nexq-core <- stores/facades <- nexq-server
# and nexq-cli depends on nexq-client alone, so the CLI stays a small,
# standalone binary for air-gapped environments.
[workspace.dependencies]
nexq-core = { path = "crates/nexq-core" }
nexq-store-memory = { path = "crates/nexq-store-memory" }
nexq-store-sql = { path = "crates/nexq-store-sql" }
nexq-store-search = { path = "crates/nexq-store-search" }
nexq-store-conformance = { path = "crates/nexq-store-conformance" }
nexq-api-rest = { path = "crates/nexq-api-rest" }
nexq-api-aws = { path = "crates/nexq-api-aws" }
nexq-metrics = { path = "crates/nexq-metrics" }
nexq-keda = { path = "crates/nexq-keda" }
nexq-client = { path = "crates/nexq-client" }

# External dependencies are declared here (single version across the workspace)
# and inherited by members with `dep = { workspace = true }`. The commented-out
# entries are the intended choices, uncommented as the crate that needs one is
# actually built.
#
# Generates the OpenAPI spec from the route and type definitions themselves, per plan
# Q18a: `ApiRouter` wraps `axum::Router`, so registering a route *is* documenting it.
# `axum-json` is a separate feature from `axum` and is what teaches aide about `Json<T>`.
#
# Deliberately *not* the `scalar`/`redoc`/`swagger` features, which serve a documentation
# UI: each renders a page that pulls its JavaScript from a CDN, which is exactly what an
# air-gapped deployment (plan Q21) cannot do. The spec itself is served instead.
aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-query"] }
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
# Only to render the times the engine already produced as RFC 3339, which is what a
# generated client turns into a real date type. Deliberately without `clock`: nothing here
# asks what time it is — `SystemTime::now` does that — so there is no timezone database and
# no platform clock dependency to carry.
chrono = { version = "0.4.42", default-features = false, features = ["std", "serde"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
hex = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
# `ring` rather than the default `aws-lc-rs` provider: it needs only a C compiler,
# where aws-lc-rs also wants cmake. One less thing an air-gapped build has to have.
rustls = { version = "0.23.43", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
] }
rustls-pemfile = "2.2.0"
# Pinned to what aide 0.15 generates against: a `JsonSchema` from a different major
# version is a different trait, and would not satisfy aide's bounds.
schemars = { version = "0.9.0", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
# Performs TLS handshakes off the accept path, so one stalled client cannot stop the
# server accepting others — and implements axum's `Listener`, so graceful shutdown is
# unchanged from the plain-TCP case.
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
tls-listener = { version = "0.11.2", default-features = false, features = [
  "axum",
  "rustls-ring",
  "tokio-net",
] }
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.25.0", features = ["v4"] }

# Test-only.
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls"] }
# reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# clap = { version = "4", features = ["derive"] }
# figment = { version = "0.10", features = ["toml", "env"] }
# tonic = "0.13"
# prometheus-client = "0.24"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "allow"           # placeholder tree; tighten once crates are implemented
unwrap_used = "warn"
