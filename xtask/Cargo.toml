[package]
name = "xtask"
description = "Build tasks: dump the OpenAPI spec, generate clients, build the web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Linked in so `xtask openapi` can ask the facade for its document rather than
# reimplementing the generation, which would be a second thing able to be wrong.
nexq-api-rest = { workspace = true }
# Reading `cargo build`'s JSON output to find the server binary, and parsing what the
# `aws` CLI prints.
serde_json = { workspace = true }

[lints]
workspace = true
