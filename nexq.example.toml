# Minimal NexQ config. Copy to `nexq.toml` and change the secret.
#
# Only the credential below is required; every other key has a default, shown
# commented out at the bottom. Any key can be overridden by an environment
# variable, nested keys joined with a double underscore:
#
#   NEXQ_AWS_API__BIND_ADDR=127.0.0.1:9000
#
# A different config file can be named with NEXQ_CONFIG=/path/to/file.toml.

# Credentials are shared by every facade. The SQS/SNS facade uses the pair for
# SigV4 signing; the REST facade takes "<key_id>.<secret>" as a bearer token.
[[auth.credentials]]
name = "dev"
key_id = "AKIANEXQDEV"
secret = "change-me"

# To reach this with the real AWS CLI:
#
#   aws configure --profile nexq        # the key_id and secret above, any region
#   aws --profile nexq --endpoint-url http://localhost:8080 sqs list-queues

# Defaults, for reference:
#
# [aws_api]
# enabled = true
# bind_addr = "0.0.0.0:8080"
# public_base_url = "http://localhost:8080"   # what queue URLs are built from
# account_id = "000000000000"
# region = "us-east-1"                        # only used to build queue ARNs
# max_clock_skew_secs = 900
#
# Serve HTTPS instead of HTTP. The table's presence is the switch — there is no
# "enabled" flag, since that would allow "on, with no certificate".
#
# [aws_api.tls]
# certificate = "/etc/nexq/fullchain.pem"     # server cert first, then intermediates
# private_key = "/etc/nexq/key.pem"
# client_ca   = "/etc/nexq/client-ca.pem"     # optional: require client certs (mTLS)
#
# NexQ's own REST API — its own listener, on the next port along, so both facades serve
# by default without either having to be moved first. Set `enabled = false` to serve only
# the SQS/SNS facade. Far fewer settings than [aws_api], because most of that section
# exists to satisfy AWS: REST needs no account id, no region, and no public base URL,
# since a resource is addressed by name in the path rather than by a URL the server hands
# out and the client has to send back.
#
# [rest_api]
# enabled = true
# bind_addr = "0.0.0.0:8081"
#
# TLS is per facade and is not inherited, in either direction — so the SQS facade can stay
# on a private interface in plain HTTP while REST serves the network over TLS. Both wanting
# the same certificate means naming it twice, which is the right trade for not having
# "switch on TLS here" quietly mean "switch it on everywhere".
#
# [rest_api.tls]
# certificate = "/etc/nexq/fullchain.pem"
# private_key = "/etc/nexq/key.pem"
# client_ca   = "/etc/nexq/client-ca.pem"
#
# Trust anchors for connections NexQ *makes* rather than serves. Nothing uses this
# yet — it is here for the nexq client and CLI, and later for TLS to SQL and search
# backends. Only these anchors are used; the platform's own store is not consulted.
#
# [client_tls]
# ca_bundle = "/etc/nexq/trusted-ca.pem"
#
# max_clock_skew_secs is how far a request's signed timestamp may be from this
# server's clock, in either direction. It is what stops a captured request from being
# replayed forever. Widen it if clients and server cannot agree on the time — an
# air-gapped deployment with no NTP may need to. Setting it to 0 switches the check
# off entirely, which makes captured requests replayable; the server logs a warning at
# startup when it is.
#
# Queue URLs are "<public_base_url>/<account_id>/<queue-name>". NexQ has no accounts,
# but real SQS URLs carry an id there and clients expect to find one, so account_id
# fills that slot. It must be exactly 12 digits; any value works, and the all-zero
# default is the one LocalStack uses. Set it before clients start caching queue URLs —
# changing it later makes the URLs they already hold invalid.
#
# region fills the same kind of slot in a queue ARN, which GetQueueAttributes reports
# as "arn:aws:sqs:<region>:<account_id>:<queue-name>". It is not checked against the
# region a client signs with — SigV4 only needs signer and verifier to agree, so any
# region has always worked and still does.
#
# With [aws_api.tls] set, remember to make public_base_url say https: it is what queue
# URLs are built from, so an http URL over a TLS listener sends clients somewhere that
# is not listening. The server warns at startup when the two disagree, since behind a
# proxy that terminates TLS they legitimately can.
