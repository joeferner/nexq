# Minimal NexQ config. Copy to `nexq.toml` and change the secret.
#
# Only the credential below is required; every other key has a default, shown
# commented out at the bottom. Any key can be overridden by an environment
# variable, nested keys joined with a double underscore:
#
#   NEXQ_AWS_API__BIND_ADDR=127.0.0.1:9000
#
# A different config file can be named with NEXQ_CONFIG=/path/to/file.toml.

# Credentials are shared by every facade. The SQS/SNS facade uses the pair for
# SigV4 signing; the REST facade takes "<key_id>.<secret>" as a bearer token.
[[auth.credentials]]
name = "dev"
key_id = "AKIANEXQDEV"
secret = "change-me"

# To reach this with the real AWS CLI:
#
#   aws configure --profile nexq        # the key_id and secret above, any region
#   aws --profile nexq --endpoint-url http://localhost:8080 sqs list-queues

# Defaults, for reference:
#
# [aws_api]
# enabled = true
# bind_addr = "0.0.0.0:8080"
# public_base_url = "http://localhost:8080"   # what queue URLs are built from
# account_id = "000000000000"
# region = "us-east-1"                        # only used to build queue ARNs
# max_clock_skew_secs = 900
#
# max_clock_skew_secs is how far a request's signed timestamp may be from this
# server's clock, in either direction. It is what stops a captured request from being
# replayed forever. Widen it if clients and server cannot agree on the time — an
# air-gapped deployment with no NTP may need to. Setting it to 0 switches the check
# off entirely, which makes captured requests replayable; the server logs a warning at
# startup when it is.
#
# Queue URLs are "<public_base_url>/<account_id>/<queue-name>". NexQ has no accounts,
# but real SQS URLs carry an id there and clients expect to find one, so account_id
# fills that slot. It must be exactly 12 digits; any value works, and the all-zero
# default is the one LocalStack uses. Set it before clients start caching queue URLs —
# changing it later makes the URLs they already hold invalid.
#
# region fills the same kind of slot in a queue ARN, which GetQueueAttributes reports
# as "arn:aws:sqs:<region>:<account_id>:<queue-name>". It is not checked against the
# region a client signs with — SigV4 only needs signer and verifier to agree, so any
# region has always worked and still does.
