[package]
name = "nexq-api-aws"
description = "SQS- and SNS-compatible facades for NexQ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
md-5 = { workspace = true }
nexq-core = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tls-listener = { workspace = true }
tokio = { workspace = true, features = ["net", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
# A real TLS client for the handshake tests, plus PEM parsing to trust the test cert.
rustls-pemfile = { workspace = true }
# Test-only: lets facade tests run against a real engine and backend. No cycle —
# both crates depend on nexq-core, and neither depends on the other outside tests.
nexq-store-memory = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "time"] }
tokio-rustls = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
