[package]
name = "nexq-server"
description = "NexQ server: wires storage backends, protocol facades, and clustering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nexq-server"
path = "src/main.rs"

[dependencies]
nexq-core = { workspace = true }
nexq-store-memory = { workspace = true }
nexq-store-sql = { workspace = true }
nexq-store-search = { workspace = true }
nexq-api-rest = { workspace = true }
nexq-api-aws = { workspace = true }
nexq-metrics = { workspace = true }
nexq-keda = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
