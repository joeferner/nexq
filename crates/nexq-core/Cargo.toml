[package]
name = "nexq-core"
description = "NexQ domain model, engine, and the Store trait every backend implements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# `sync` for the long-poll waiter registry, `time` for its deadline.
tokio = { workspace = true, features = ["sync", "time"] }
uuid = { workspace = true }

[dev-dependencies]
# `figment::Jail` — a sandboxed cwd and env for the config tests.
figment = { workspace = true, features = ["test"] }
# `test-util` for a paused clock, so a test can observe the 20-second receive cap
# without taking 20 seconds to do it.
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "test-util",
  "time",
] }

[lints]
workspace = true
