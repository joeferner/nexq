[package]
name = "nexq-core"
description = "NexQ domain model, engine, and the Store trait every backend implements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
figment = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# `sync` for the long-poll waiter registry, `time` for its deadline and the dead-letter
# sweep's, `rt` to spawn a redrive — which outlives the request that started it, so it
# cannot be the caller's future.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The engine logs where a message went. A message leaving the queue it was sent to is the
# one thing here somebody comes looking for afterwards, and "where did my message go" is
# not a question a log should be silent about.
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# `figment::Jail` — a sandboxed cwd and env for the config tests.
figment = { workspace = true, features = ["test"] }
# `test-util` for a paused clock, so a test can observe the 20-second receive cap
# without taking 20 seconds to do it.
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "test-util",
  "time",
] }

[lints]
workspace = true
